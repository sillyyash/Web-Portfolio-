<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project 2 - Blender Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* Header */
header {
  padding: 18px;
  text-align: center;
  background: #111;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 1px;
}

/* Layout */
.container {
  display: flex;
  flex-direction: column;
  gap: 35px;
  padding: 18px;
}

/* Viewer */
#viewer {
  width: 100%;
  height: 500px;
  background: #151515;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

/* Loader overlay */
#loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #151515;
  font-size: 14px;
  color: #aaa;
}

/* Section title */
h2 {
  font-size: 18px;
  margin: 0 0 10px 0;
}

/* Process grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.grid img, .grid video {
  width: 100%;
  border-radius: 10px;
}

/* Back button */
.back {
  position: fixed;
  top: 12px;
  left: 12px;
  padding: 8px 12px;
  background: #222;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  z-index: 10;
}

.back:hover {
  background: #333;
}
</style>
</head>

<body>

<button class="back" onclick="history.back()">← Back</button>

<header>Blender Architectural Project</header>

<div class="container">

  <!-- 3D VIEWER -->
  <div>
    <h2>3D Model Preview</h2>
    <div id="viewer">
      <div id="loading">Loading 3D Model...</div>
    </div>
  </div>

  <!-- PROCESS (kept exactly like you wanted) -->
  <div>
    <h2>Process</h2>
    <div class="grid">
      <img src="images/img1.png" alt="step1">
      <img src="images/img2.jpg" alt="step2">
      <video controls src="videos/process.mp4"></video>
    </div>
  </div>

</div>

<!-- THREE.JS (MODULE STYLE - FIXED) -->
<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

let scene, camera, renderer, model, controls;

console.log("🚀 SCRIPT STARTED");

init();

function init() {
  // Replace your existing lights with these
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));

  const dir = new THREE.DirectionalLight(0xffffff, 2);
  dir.position.set(5, 10, 5);
  scene.add(dir);

  const dir2 = new THREE.DirectionalLight(0xffffff, 1);
  dir2.position.set(-5, -5, -5);
  scene.add(dir2);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
  scene.add(hemi);

  const container = document.getElementById("viewer");

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(
    60,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
  );
  camera.position.set(2.5, 2, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);


  // CONTROLS
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // LOAD MODEL
  const loader = new GLTFLoader();

  const modelPath = "./model.glb";

  console.log("📦 Trying to load:", modelPath);

 loader.load(
    modelPath,
     (gltf) => {
      model = gltf.scene;gltf
      scene.add(model);

      // ✅ AUTO-FIT CAMERA TO MODEL
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(center.x, center.y, center.z + maxDim * 2);
      camera.lookAt(center);

      controls.target.copy(center);
      controls.update();

      // Log so you can see what's happening
      console.log("Model size:", size);
      console.log("Model center:", center);

      document.getElementById("loading").style.display = "none";
    },

    (xhr) => {
      if (xhr.total > 0) {
        const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
        document.getElementById("loading").innerText =
          `Loading ${percent}%`;
      } else {
        document.getElementById("loading").innerText =
          `Loading...`;
      }
    },

    (error) => {
      console.error("❌ GLB FAILED:", error);
      document.getElementById("loading").innerText =
        "❌ FAILED (check console & network tab)";
    }
  );

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// RESIZE FIXED
window.addEventListener("resize", () => {

  const container = document.getElementById("viewer");

  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>

</body>
</html>
