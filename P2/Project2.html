<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project 2 - Blender Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

/* Header */
header {
  padding: 20px;
  text-align: center;
  background: #111;
  font-size: 24px;
  font-weight: bold;
}

/* Layout */
.container {
  display: flex;
  flex-direction: column;
  gap: 40px;
  padding: 20px;
}

/* 3D viewer */
#viewer {
  width: 100%;
  height: 500px;
  background: #1a1a1a;
  border-radius: 12px;
}

/* Section title */
h2 {
  margin-bottom: 10px;
}

/* Process grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.grid img, .grid video {
  width: 100%;
  border-radius: 10px;
}

/* Back button */
.back {
  position: fixed;
  top: 15px;
  left: 15px;
  padding: 10px 15px;
  background: #333;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.back:hover {
  background: #555;
}
</style>
</head>

<body>

<button class="back" onclick="history.back()">← Back</button>

<header>Blender Architectural Project</header>

<div class="container">

  <!-- 3D VIEWER -->
  <div>
    <h2>3D Model Preview</h2>
    <div id="viewer"></div>
  </div>

  <!-- PROCESS -->
  <div>
    <h2>Process</h2>
    <div class="grid">
      <img src="images/img1.jpg" alt="step1">
      <img src="images/img2.jpg" alt="step2">
      <video controls src="videos/process.mp4"></video>
    </div>
  </div>

</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene, camera, renderer, model, controls;

function init() {

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / 500,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, 500);
  document.getElementById("viewer").appendChild(renderer.domElement);

  // light
  const light = new THREE.AmbientLight(0xffffff, 1);
  scene.add(light);

  // controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);

  // load model
  const loader = new THREE.GLTFLoader();
  loader.load("model.glb", function (gltf) {
    model = gltf.scene;
    scene.add(model);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, 500);
});

init();
</script>

</body>
</html>
