<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Existing Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    <!-- Custom Cursor Styles -->
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; <!-- Hide default cursor -->
        }

        body.light-mode, body.dark-mode {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Custom Cursor Elements */
        #cursor {
            position: fixed;
            top: -5px;
            left: -5px;
            width: 10px;
            height: 10px;
            background-color: white; <!-- Default cursor color -->
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }

        #cursor-border {
            --size: 50px;
            position: fixed;
            top: calc(var(--size) / -2);
            left: calc(var(--size) / -2);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            box-shadow: 0 0 0 1px white; <!-- Default border color -->
            pointer-events: none;
            transition: top 0.15s ease-out, left 0.15s ease-out, width 0.15s ease-out,
                        height 0.15s ease-out, background-color 0.15s ease-out;
            z-index: 998; <!-- Slightly lower z-index than #cursor for proper layering -->
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><button id="theme-toggle" data-cursor="pointer">Toggle Theme</button></li>
            </ul>
        </nav>
    </header>

    <!-- Sections (existing) -->
    <section id="home" class="animated-section">
        <!-- ... existing content ... -->
    </section>

    <section id="about" class="animated-section">
        <h2>About Me</h2>
        <p>I am a web developer with a passion for creating beautiful and functional websites.</p>
    </section>

    <section id="projects" class="animated-section">
        <h2>Projects</h2>
        <ul>
            <li><button class="pop-button" data-cursor="pointer">Project 1</button></li>
            <li><button class="pop-button" data-cursor="pointer">Project 2</button></li>
            <li><button class="pop-button" data-cursor="pointer">Project 3</button></li>
        </ul>
    </section>

    <section id="contact" class="animated-section">
        <h2>Contact Me</h2>
        <p>Email: example@example.com</p>
        <p>Phone: +1234567890</p>
    </section>

    <!-- Custom Cursor Elements -->
    <div id="cursor"></div>
    <div id="cursor-border"></div>

    <!-- Existing Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
